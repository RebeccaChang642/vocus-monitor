name: Vocus Page Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: |
          max_attempts=3
          attempt=1
          until playwright install chromium && playwright install-deps chromium; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Playwright browser install failed after $max_attempts attempts. Giving up."
              exit 1
            fi
            backoff=$((attempt * 10))
            echo "Playwright browser install failed (attempt $attempt/$max_attempts). Retrying in ${backoff}s..."
            sleep "$backoff"
            attempt=$((attempt + 1))
          done
          echo "Playwright browser install succeeded on attempt $attempt/$max_attempts."

      - name: Run monitor script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python check_vocus.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain snapshot.json state.json)" ]; then
            git add snapshot.json state.json
            git commit -m "Update state $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash || true
            git push
          else
            echo "No changes"
          fi
